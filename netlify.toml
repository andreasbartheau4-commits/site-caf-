# Hébergement Netlify : le site + les fonctions de paiement et de stock.
[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install --omit=dev --no-audit --no-fund"

[functions]
  node_bundler = "esbuild"
  included_files = ["assets/produits.js", "assets/config.js"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://checkout.stripe.com\")"

[[headers]]
  for = "/gestion.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
