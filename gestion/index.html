<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion Maison Bartheau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe7; --surface:#fffcf8; --surface-2:#f9f3ec; --ink:#2a1f19; --muted:#7b6a5d; --line:#e6dbcd;
  --accent:#9c4f2a; --accent-soft:#f3e2d6; --accent-ink:#fff;
  --ok:#2f7a4a; --ok-soft:#e1f1e6; --warn:#a86a12; --warn-soft:#fbefd9; --bad:#b0362f; --bad-soft:#f8e1de; --info:#3b6aa0; --info-soft:#e2ecf7;
  --shadow:0 1px 2px rgba(60,35,20,.06),0 6px 24px rgba(60,35,20,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15110e; --surface:#1f1915; --surface-2:#271f1a; --ink:#f2e9df; --muted:#a8988a; --line:#382e27;
  --accent:#e0915f; --accent-soft:#3a281d; --accent-ink:#1a120d;
  --ok:#6cc58d; --ok-soft:#1d3226; --warn:#e4ad55; --warn-soft:#3a2d17; --bad:#ef7d74; --bad-soft:#3d1f1c; --info:#82aee0; --info-soft:#1c2a3b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15110e; --surface:#1f1915; --surface-2:#271f1a; --ink:#f2e9df; --muted:#a8988a; --line:#382e27;
  --accent:#e0915f; --accent-soft:#3a281d; --accent-ink:#1a120d;
  --ok:#6cc58d; --ok-soft:#1d3226; --warn:#e4ad55; --warn-soft:#3a2d17; --bad:#ef7d74; --bad-soft:#3d1f1c; --info:#82aee0; --info-soft:#1c2a3b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em;margin:0}
h1{font-size:30px}h2{font-size:20px}h3{font-size:16px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{padding:0 10px}
.brand b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:650}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--surface-2)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav a .pill{font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--muted)}
main{padding-block:30px 60px;padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));max-width:1240px;width:100%;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card>h2,.card>h3{margin-bottom:12px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-family:Fraunces,Georgia,serif;font-size:28px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:500 14px Inter,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.act{text-align:right;white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
.muted{color:var(--muted)}
.small{font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-mut{background:var(--surface-2);color:var(--muted)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:Fraunces,Georgia,serif;font-size:18px;margin-bottom:4px}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .dot{width:10px;height:10px;border-radius:50%;flex:none}
.task .t{flex:1;min-width:0}
.task .t b{font-weight:600}
.task .t div{font-size:13px;color:var(--muted)}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.info{background:var(--info)}.dot.ok{background:var(--ok)}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:15px Inter,system-ui,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.field{min-width:0}
.field.full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:400}
.search{max-width:260px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface-2);padding:4px;border-radius:11px;width:fit-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font:500 13px Inter,system-ui,sans-serif;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.note{background:var(--info-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px}
.note.warn{background:var(--warn-soft)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,8,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow-y:auto}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:760px;border:1px solid var(--line)}
.mbox.wide{max-width:1000px}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.mbody{padding:20px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 18px 18px}
.lines td{padding:6px 4px}
.lines input,.lines select{padding:6px 8px;font-size:14px}
.totals{margin-left:auto;max-width:300px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-weight:650;font-size:17px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}
.chart text{fill:var(--muted);font-size:11px;font-family:Inter,system-ui,sans-serif}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.mailprev{white-space:pre-wrap;font-family:inherit}
.ph{display:flex;flex-wrap:wrap;gap:6px}
.ph code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px;cursor:pointer}
#print{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:12px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand b{font-size:17px}.brand span{display:none}
  nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  nav::-webkit-scrollbar{display:none}
  nav a{white-space:nowrap;padding:7px 10px}
  .side-foot{display:none}
  main{padding-block:20px 50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:25px}
}
/* impression devis/facture */
@media print{
  body>*:not(#print){display:none!important}
  body{background:#fff}
  #print{display:block!important;color:#111;background:#fff}
  @page{margin:14mm}
}
.doc{font:12.5px/1.45 Inter,system-ui,sans-serif;color:#111;max-width:780px;margin:0 auto}
.doc h1{font-family:Fraunces,Georgia,serif;font-size:26px;color:#111}
.doc .top{display:flex;justify-content:space-between;gap:20px;margin-bottom:28px}
.doc .who{width:46%}
.doc .meta{text-align:right}
.doc .meta .big{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:650;color:#7a3a1c;text-transform:uppercase;letter-spacing:.04em}
.doc .to{background:#f6f0e8;border-radius:8px;padding:12px 14px;margin-left:auto;width:46%}
.doc table th{color:#555;border-bottom:1.5px solid #111;font-size:11px}
.doc table td{border-bottom:1px solid #ddd;padding:8px 10px}
.doc .tot{margin-left:auto;width:280px;margin-top:14px}
.doc .tot div{display:flex;justify-content:space-between;padding:3px 0}
.doc .tot .big{font-weight:700;font-size:15px;border-top:1.5px solid #111;padding-top:6px;margin-top:4px}
.doc .legal{margin-top:30px;font-size:10.5px;color:#555;border-top:1px solid #ddd;padding-top:10px}
.doc .sign{margin-top:28px;display:flex;justify-content:flex-end}
.doc .sign div{border:1px dashed #aaa;border-radius:8px;width:260px;height:90px;padding:8px;font-size:11px;color:#666}
.doc .stamp{display:inline-block;border:2px solid #b0362f;color:#b0362f;padding:2px 10px;border-radius:6px;font-weight:700;letter-spacing:.1em;transform:rotate(-4deg);margin-top:6px}
.doc .stamp.ok{border-color:#2f7a4a;color:#2f7a4a}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>Maison Bartheau</b><span>Gestion · espace pro</span></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="syncState">Données enregistrées sur cet appareil.</span><br><a href="#reglages">Sauvegarder / exporter</a></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>
<div id="print"></div>

<script>
"use strict";
/* ============ utilitaires ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const eur = n => (+n || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const num = n => (+n || 0).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ymd = (y, m, d) => isoOf(new Date(y, m, d));
const today = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00'); d.setDate(d.getDate() + (+n || 0)); return isoOf(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const fdate = iso => iso ? new Date(iso + 'T12:00').toLocaleDateString('fr-FR') : '—';
const fdateLong = iso => iso ? new Date(iso + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
const MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
const MS = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sep', 'Oct', 'Nov', 'Déc'];
const inRange = (d, a, b) => d && d >= a && d <= b;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }

/* ============ modèles d'emails ============ */
const TEMPLATES = {
  commande_confirmation: { nom: 'Commande site — confirmation', subject: 'Votre commande {numero} est confirmée – {entreprise}', body:
`Bonjour {client_contact},

Merci pour votre commande, elle est bien disponible !

Récapitulatif (réf. {numero}) :
{lignes}

Montant du café : {montant_ttc}
Frais d'envoi : {frais_envoi}

{infos_paiement}

Dès réception de votre règlement, votre café est torréfié, mis en sachet et expédié sous quelques jours. Je vous préviens par email au moment de l'envoi.

Belle journée,
{signature}` },
  commande_expediee: { nom: 'Commande site — expédition', subject: 'Votre café est en route – commande {numero}', body:
`Bonjour {client_contact},

Bonne nouvelle : votre commande {numero} vient de partir.

{lignes}

{suivi}

Pour profiter pleinement de ses arômes, gardez le sachet bien fermé, à l'abri de la lumière et de la chaleur.

Merci pour votre confiance et bonne dégustation !
{signature}` },
  demande_pro_reponse: { nom: 'Demande pro — réponse', subject: 'Votre demande – {entreprise}', body:
`Bonjour {client_contact},

Merci pour votre message et pour l'intérêt que vous portez à {entreprise} ({articles}).

Je vous propose d'échanger rapidement pour mieux connaître vos besoins : volumes, machine, rythme de livraison. Voici mes disponibilités : [à compléter].

Vous trouverez nos conditions professionnelles en pièce jointe.

Au plaisir d'échanger avec vous,
{signature}` },
  devis_envoi: { nom: 'Devis — envoi', subject: 'Votre devis {numero} – {entreprise}', body:
`Bonjour {client_contact},

Je vous remercie pour l'intérêt que vous portez à {entreprise}.

Comme convenu, vous trouverez ci-joint notre devis n° {numero} d'un montant de {montant_ttc}.

Récapitulatif de la proposition :
{lignes}

Cette proposition est valable jusqu'au {validite}. Pour la valider, il vous suffit de nous retourner le devis signé avec la mention « Bon pour accord », ou simplement de répondre à ce message.

Je reste bien entendu à votre disposition pour toute question ou adaptation.

Bien cordialement,
{signature}` },
  devis_relance: { nom: 'Devis — relance', subject: 'Suivi de votre devis {numero}', body:
`Bonjour {client_contact},

Je me permets de revenir vers vous au sujet du devis n° {numero} du {date}, d'un montant de {montant_ttc}, que nous vous avons adressé.

Avez-vous pu en prendre connaissance ? Si certains points méritent d'être ajustés (quantités, délais, options), je serai ravi d'en discuter avec vous afin de vous proposer la solution la plus adaptée.

Pour rappel, cette proposition reste valable jusqu'au {validite}.

Dans l'attente de votre retour, je vous souhaite une excellente journée.

Bien cordialement,
{signature}` },
  devis_accepte: { nom: 'Devis — remerciement accord', subject: 'Merci pour votre confiance – devis {numero}', body:
`Bonjour {client_contact},

Nous avons bien reçu votre accord pour le devis n° {numero} d'un montant de {montant_ttc}, et nous vous en remercions sincèrement.

Nous lançons dès à présent la préparation de votre commande. Nous reviendrons vers vous très prochainement pour confirmer les modalités et la date de livraison / d'intervention.

La facture correspondante vous sera adressée selon les conditions convenues.

Merci encore pour votre confiance, c'est un plaisir de travailler avec vous.

Bien cordialement,
{signature}` },
  facture_envoi: { nom: 'Facture — envoi', subject: 'Facture {numero} – {entreprise}', body:
`Bonjour {client_contact},

Vous trouverez ci-joint la facture n° {numero} du {date}, d'un montant de {montant_ttc}, payable au plus tard le {echeance}.

{infos_paiement}

Merci de bien vouloir indiquer la référence {numero} lors de votre règlement afin d'en faciliter le rapprochement.

Nous vous remercions pour votre confiance et restons à votre disposition pour toute question.

Bien cordialement,
{signature}` },
  relance_1: { nom: 'Relance 1 — rappel courtois', subject: 'Rappel – facture {numero} arrivée à échéance', body:
`Bonjour {client_contact},

Sauf erreur ou omission de notre part, le règlement de la facture n° {numero} du {date}, arrivée à échéance le {echeance}, ne nous est pas encore parvenu.

Montant restant dû : {reste}

Il s'agit très probablement d'un simple oubli. Nous vous remercions de bien vouloir procéder au règlement dans les meilleurs délais.

{infos_paiement}

Si votre paiement a été effectué entre-temps, merci de ne pas tenir compte de ce message.

Bien cordialement,
{signature}` },
  relance_2: { nom: 'Relance 2 — relance ferme', subject: '2e relance – facture {numero} impayée', body:
`Bonjour {client_contact},

Malgré notre précédent rappel du {derniere_relance}, nous constatons que la facture n° {numero} du {date}, échue depuis le {echeance} ({jours_retard} jours de retard), reste impayée à ce jour.

Montant restant dû : {reste}

Nous vous remercions de procéder à son règlement sous 8 jours à compter de la réception de ce message. Nous vous rappelons que tout retard de paiement entraîne l'application des pénalités prévues dans nos conditions générales{mention_indemnite_courte}.

{infos_paiement}

En cas de difficulté, n'hésitez pas à nous contacter afin que nous trouvions ensemble une solution (échéancier, etc.).

Bien cordialement,
{signature}` },
  relance_3: { nom: 'Relance 3 — mise en demeure', subject: 'Mise en demeure de payer – facture {numero}', body:
`{client},

Objet : mise en demeure de payer – facture n° {numero}

Madame, Monsieur,

/* ============ tâches automatiques ============ */
function lowStock() { return state.produits.filter(p => p.suivi !== false && (+p.qte || 0) <= (+p.seuil || 0)); }
function relanceDue(f) {
  if (fStatus(f) !== 'retard') return 0;
  const s = S(); const n = (f.relances || []).length; if (n >= 3) return 0;
  const lvl = n + 1; const seuil = [0, s.relance1, s.relance2, s.relance3][lvl];
  const last = (f.relances || []).slice(-1)[0];
  if (joursRetard(f) < seuil) return 0;
  if (last && daysBetween(last.date, today()) < 5) return 0;
  return lvl;
}
function tasks() {
  const out = []; const s = S(); const t = today();
  for (const f of state.factures) {
    const c = client(f.clientId); const nm = c ? c.nom : 'Client';
    const lvl = relanceDue(f);
    if (lvl) out.push({ p: 0, kind: 'bad', title: `Relancer ${nm} — facture ${f.numero}`, sub: `${eur(reste(f))} · ${joursRetard(f)} j de retard · ${['', 'rappel courtois', 'relance ferme', 'mise en demeure'][lvl]}`, act: 'relancerFacture', id: f.id, btn: `Relance ${lvl}` });
    if (f.statut === 'brouillon') out.push({ p: 2, kind: 'info', title: `Facture à envoyer — ${nm}`, sub: `${eur(totals(f).ttc)} · brouillon créé le ${fdate(f.date)}`, act: 'envoyerFacture', id: f.id, btn: 'Valider & envoyer' });
    if (f.merciPending && s.merciAuto) out.push({ p: 3, kind: 'ok', title: `Remercier ${nm} pour son paiement`, sub: `Facture ${f.numero} réglée`, act: 'merci', id: f.id, btn: 'Envoyer le merci' });
  }
  for (const d of state.devis) {
    const c = client(d.clientId); const nm = c ? c.nom : 'Client'; const st = dStatus(d);
    if (st === 'brouillon') out.push({ p: 3, kind: 'info', title: `Devis à envoyer — ${nm}`, sub: `${d.numero} · ${eur(totals(d).ttc)}`, act: 'envoyerDevis', id: d.id, btn: 'Envoyer' });
    if (st === 'envoye') {
      const last = (d.relances || []).slice(-1)[0]?.date || d.envoyeLe || d.date;
      if (daysBetween(last, t) >= s.relanceDevisJours && (d.relances || []).length < 2) out.push({ p: 1, kind: 'warn', title: `Relancer le devis ${d.numero} — ${nm}`, sub: `Sans réponse depuis ${daysBetween(last, t)} j · expire le ${fdate(d.expire)}`, act: 'relancerDevis', id: d.id, btn: 'Relancer' });
    }
    if (st === 'accepte') out.push({ p: 2, kind: 'ok', title: `Facturer le devis accepté ${d.numero} — ${nm}`, sub: eur(totals(d).ttc), act: 'convertir', id: d.id, btn: 'Créer la facture' });
  }
  for (const o of state.commandes) {
    if (o.statut === 'nouvelle') out.push({ p: 0, kind: 'bad', title: `${isDemande(o) ? 'Nouvelle demande' : 'Nouvelle commande'} du site — ${o.client.etab || o.client.nom || o.client.email || 'client'}`, sub: `${orderLabel(o)}${o.total ? ' · ' + eur(o.total) : ''} · reçue le ${fdate(o.recu)}`, act: isDemande(o) ? 'repondreDemande' : 'confirmerCommande', id: o.id, btn: isDemande(o) ? 'Répondre' : 'Confirmer' });
    if (o.statut === 'confirmee' && !isDemande(o)) out.push({ p: 1, kind: 'warn', title: `À préparer et expédier — ${o.client.etab || o.client.nom || 'client'}`, sub: `${orderLabel(o)} · confirmée le ${fdate(o.confirmeLe || o.recu)}`, act: 'expedierCommande', id: o.id, btn: 'Expédiée' });
  }
  const low = lowStock();
  const byF = {}; low.forEach(p => { const k = p.fournisseur || 'Fournisseur non renseigné'; (byF[k] = byF[k] || []).push(p); });
  Object.entries(byF).forEach(([fo, ps]) => out.push({ p: 1, kind: 'warn', title: `Stock bas : ${ps.length} article${ps.length > 1 ? 's' : ''} chez ${fo}`, sub: ps.map(p => `${p.nom} (${num(p.qte)} ${p.unite || ''})`).join(', '), act: 'commander', id: fo, btn: 'Commander' }));
  const y = new Date().getFullYear();
  const decl = [...periods(y, s.urssafPeriode, 'urssaf'), ...periods(y - 1, s.urssafPeriode, 'urssaf')].filter(p => p.to < t && !state.declarations[p.key] && daysBetween(p.due, t) <= 45 && daysBetween(t, p.due) <= 31);
  decl.forEach(p => { const c = urssafCalc(p); out.push({ p: daysBetween(t, p.due) < 7 ? 0 : 2, kind: p.due < t ? 'bad' : 'warn', title: `Déclarer l'URSSAF — ${p.label}`, sub: `CA ${eur(c.ca)} · cotisations ≈ ${eur(c.total)} · avant le ${fdate(p.due)}`, href: '#urssaf', btn: 'Voir' }); });
  if (s.regimeTva === 'reel') {
    [...periods(y, s.tvaPeriode, 'tva'), ...periods(y - 1, s.tvaPeriode, 'tva')].filter(p => p.to < t && !state.declarations[p.key] && daysBetween(p.due, t) <= 45 && daysBetween(t, p.due) <= 31)
      .forEach(p => { const c = tvaCalc(p); out.push({ p: daysBetween(t, p.due) < 7 ? 0 : 2, kind: p.due < t ? 'bad' : 'warn', title: `Déclarer la TVA — ${p.label}`, sub: `TVA nette ${eur(c.net)} · avant le ${fdate(p.due)} (indicatif)`, href: '#tva', btn: 'Voir' }); });
  }
  return out.sort((a, b) => a.p - b.p);
}

        doc.lignes = doc.lignes.filter(l => l.desc.trim() || l.pu);
        if (!doc.clientId) { toast('Choisis un client'); return false; }
        if (!doc.lignes.length) { toast('Ajoute au moins une ligne'); return false; }
        if (isDevis && !doc.numero) doc.numero = nextNumero('devis');
        const i = list.findIndex(x => x.id === doc.id); if (i >= 0) list[i] = doc; else list.push(doc);
        save(); return true;
      };
      $('#eSave', box).onclick = () => { if (persist()) { closeModal(); render(); toast('Enregistré ✔'); } };
      $('#eSend', box).onclick = () => { if (persist()) { closeModal(); isDevis ? ACT.envoyerDevis(doc.id) : ACT.envoyerFacture(doc.id); } };
      sync();
    }
  });
}
ACT.newDevis = id => editDoc('devis', null, newDoc('devis', id && client(id) ? id : ''));
ACT.newFacture = id => editDoc('facture', null, newDoc('facture', id && client(id) ? id : ''));
const getD = id => state.devis.find(d => d.id === id), getF = id => state.factures.find(f => f.id === id);

ACT.envoyerDevis = id => { const d = getD(id); const c = client(d.clientId) || {};
  compose({ type: 'devis_envoi', to: c.email, vars: docVars(d, 'devis'), ref: d.numero, onSent: () => { if (d.statut === 'brouillon') { d.statut = 'envoye'; d.envoyeLe = today(); } } }); };
ACT.relancerDevis = id => { const d = getD(id); const c = client(d.clientId) || {};
  compose({ type: 'devis_relance', to: c.email, vars: docVars(d, 'devis'), ref: d.numero, onSent: () => { (d.relances = d.relances || []).push({ date: today() }); } }); };
ACT.accepterDevis = id => { const d = getD(id); d.statut = 'accepte'; d.accepteLe = today(); save(); render(); const c = client(d.clientId) || {};
  compose({ type: 'devis_accepte', to: c.email, vars: docVars(d, 'devis'), ref: d.numero }); };
ACT.convertir = id => { const d = getD(id); const f = newDoc('facture', d.clientId);
  Object.assign(f, { lignes: JSON.parse(JSON.stringify(d.lignes)), remise: d.remise, notes: d.notes, devisId: d.id, assujetti: d.assujetti });
  f.notes = (f.notes ? f.notes + '\n' : '') + `Selon devis n° ${d.numero} du ${fdate(d.date)}.`;
  state.factures.push(f); d.factureId = f.id; d.statut = 'accepte'; save(); toast('Facture brouillon créée depuis le devis'); location.hash = '#factures'; render(); editDoc('facture', f.id); };

ACT.moreDevis = id => { const d = getD(id); const st = dStatus(d);

    st !== 'facture' && ['Marquer accepté', () => ACT.accepterDevis(id)],

  ]); };

function finaliser(f) {
  if (f.statut !== 'brouillon') return;
  f.numero = nextNumero('facture'); f.statut = 'envoyee'; f.valideLe = today();
  if (!f.stockDeduit) { (f.lignes || []).forEach(l => { const p = produit(l.produitId); if (p) { p.qte = r2((+p.qte || 0) - (+l.qte || 0)); state.mouvements.unshift({ id: uid(), date: today(), produitId: p.id, delta: -l.qte, motif: 'Facture ' + f.numero }); } }); f.stockDeduit = true; }
  if (f.devisId) { const d = getD(f.devisId); if (d) d.factureId = f.id; }
}
ACT.envoyerFacture = id => { const f = getF(id); const c = client(f.clientId) || {};
  if (f.statut === 'brouillon') { finaliser(f); save(); render(); toast(`Facture validée : ${f.numero}`); }
  compose({ type: 'facture_envoi', to: c.email, vars: docVars(f, 'facture'), ref: f.numero }); };
ACT.relancerFacture = id => { const f = getF(id); const c = client(f.clientId) || {}; const lvl = Math.min(3, (f.relances || []).length + 1);
  compose({ type: 'relance_' + lvl, types: ['relance_1', 'relance_2', 'relance_3'], to: c.email, vars: docVars(f, 'facture'), ref: f.numero, onSent: t => { (f.relances = f.relances || []).push({ date: today(), niveau: +t.slice(-1) || lvl }); } }); };
ACT.merci = id => { const f = getF(id); const c = client(f.clientId) || {};
  compose({ type: 'paiement_recu', to: c.email, vars: docVars(f, 'facture'), ref: f.numero, onSent: () => { f.merciPending = false; } }); };
ACT.paiement = id => { const f = getF(id); const rst = reste(f);
  openModal({ title: `Paiement — facture ${esc(f.numero)}`, body: `
    <div class="fg"><div class="field"><label>Date d'encaissement</label><input type="date" name="date" value="${today()}"></div>

    ${(f.paiements || []).length ? `<h3 style="margin:18px 0 6px">Déjà reçu</h3><table><tbody>${f.paiements.map(p => `<tr><td>${fdate(p.date)}</td><td>${esc(p.mode)}</td><td class="n">${eur(p.montant)}</td></tr>`).join('')}</tbody></table>` : ''}
    <p class="small muted" style="margin:12px 0 0">Reste dû : <b>${eur(rst)}</b>. Le paiement est compté dans ton CA URSSAF à sa date d'encaissement.</p>`,
    foot: `<button class="btn" data-close2>Annuler</button><button class="btn pri" data-ok>Enregistrer le paiement</button>`,
    mount(b) { $('[data-close2]', b).onclick = closeModal; $('[data-ok]', b).onclick = () => { const v = formData(b); if (!(v.montant > 0)) return toast('Montant invalide');
      (f.paiements = f.paiements || []).push({ id: uid(), date: v.date || today(), montant: r2(v.montant), mode: v.mode });
      const full = reste(f) <= 0.004; if (full) f.merciPending = true; save(); closeModal(); render();
      toast(full ? 'Facture soldée ✔' : 'Paiement partiel enregistré');
      if (full && S().merciAuto) ACT.merci(id); }; } }); };
ACT.pdfFacture = id => printDoc('facture', getF(id));
ACT.moreFacture = id => { const f = getF(id); const st = fStatus(f);
  menu(`Facture ${f.numero || '(brouillon)'}`, [

    ['Dupliquer en brouillon', () => { const n = newDoc('facture', f.clientId); Object.assign(n, { lignes: JSON.parse(JSON.stringify(f.lignes)), remise: f.remise, notes: f.notes, assujetti: f.assujetti }); state.factures.push(n); save(); render(); editDoc('facture', n.id); }],
    ['Supprimer', () => confirmBox(st === 'brouillon' ? 'Supprimer ce brouillon ?' : `⚠️ La facture ${f.numero} a été émise : la supprimer crée un trou dans la numérotation (non conforme). Préfère un avoir. Supprimer quand même ?`, () => { state.factures = state.factures.filter(x => x.id !== id); save(); render(); }, 'Supprimer'), 'danger'],

function menu(title, items) {

function printDoc(kind, d) {
  const s = S(); const c = client(d.clientId) || {}; const t = totals(d); const isF = kind === 'facture'; const st = isF ? fStatus(d) : dStatus(d);
  const adr = [s.adresse, [s.cp, s.ville].filter(Boolean).join(' ')].filter(Boolean);

    legal.push(`Date d'échéance : ${fdate(d.echeance)}. Pas d'escompte pour paiement anticipé.`);

  } else legal.push(`Devis valable jusqu'au ${fdate(d.expire)}. Devis gratuit.`);

      <div style="margin-top:6px;color:#555">${s.siret ? 'SIRET ' + esc(s.siret) : '<i>SIRET à renseigner dans Réglages</i>'}${s.tvaIntra && d.assujetti ? '<br>TVA ' + esc(s.tvaIntra) : ''}</div></div>
      <div class="meta"><div class="big">${isF ? 'Facture' : 'Devis'}</div><div><b>N° ${esc(d.numero || 'BROUILLON')}</b></div><div>Date : ${fdate(d.date)}</div>${isF ? `<div>Échéance : ${fdate(d.echeance)}</div>` : `<div>Valable jusqu'au : ${fdate(d.expire)}</div>`}
      ${st === 'payee' ? '<div class="stamp ok">PAYÉE</div>' : st === 'brouillon' ? '<div class="stamp">BROUILLON</div>' : ''}</div></div>
    <div class="to"><div style="font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.06em">${isF ? 'Facturé à' : 'Destinataire'}</div><b>${esc(c.nom || '')}</b>${c.contact ? '<br>' + esc(c.contact) : ''}${c.adresse ? '<br>' + esc(c.adresse).replace(/\n/g, '<br>') : ''}${c.siret ? '<br>SIRET ' + esc(c.siret) : ''}${c.email ? '<br>' + esc(c.email) : ''}</div>
    <table style="margin-top:26px"><thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">P.U. HT</th>${d.assujetti ? '<th class="n">TVA</th>' : ''}<th class="n">Total HT</th></tr></thead><tbody>
    ${d.lignes.map(l => `<tr><td>${esc(l.desc)}</td><td class="n">${num(l.qte)}</td><td class="n">${eur(l.pu)}</td>${d.assujetti ? `<td class="n">${String(l.tva).replace('.', ',')} %</td>` : ''}<td class="n">${eur(l.qte * l.pu)}</td></tr>`).join('')}</tbody></table>
    <div class="tot">${d.remise ? `<div><span>Sous-total HT</span><span>${eur(t.brut)}</span></div><div><span>Remise ${num(d.remise)} %</span><span>−${eur(t.brut - t.ht)}</span></div>` : ''}<div><span>Total HT</span><span>${eur(t.ht)}</span></div>
      ${d.assujetti ? Object.entries(t.byRate).filter(([r]) => +r).map(([r, v]) => `<div><span>TVA ${String(r).replace('.', ',')} %</span><span>${eur(v)}</span></div>`).join('') : ''}
      <div class="big"><span>${d.assujetti ? 'Total TTC' : 'Net à payer'}</span><span>${eur(t.ttc)}</span></div>
      ${isF && paid(d) > 0 ? `<div><span>Déjà réglé</span><span>−${eur(paid(d))}</span></div><div style="font-weight:700"><span>Reste dû</span><span>${eur(reste(d))}</span></div>` : ''}</div>
    ${d.notes ? `<p style="margin-top:22px;white-space:pre-wrap">${esc(d.notes)}</p>` : ''}
    ${isF && s.iban ? `<p style="margin-top:18px"><b>Règlement par virement</b><br>IBAN : ${esc(s.iban)}${s.bic ? ' · BIC : ' + esc(s.bic) : ''}<br>Référence à indiquer : ${esc(d.numero || '')}</p>` : ''}
    ${!isF ? `<div class="sign"><div>Bon pour accord — date et signature :</div></div>` : ''}
    <div class="legal">${legal.join('<br>')}</div></div>`;
  const name = `${isF ? 'Facture' : 'Devis'} ${d.numero || 'brouillon'} - ${c.nom || ''}`.trim();

    body: `<div style="background:#fff;border-radius:10px;padding:24px;overflow-x:auto">${docHtml}</div>`,
    foot: `<span class="small muted" style="margin-right:auto;align-self:center">${isArt() ? 'Télécharge le document, ouvre-le puis Imprimer → Enregistrer en PDF.' : 'Imprimer → « Enregistrer en PDF » pour obtenir le fichier.'}</span><button class="btn" data-dl>Télécharger</button>${isArt() ? '' : '<button class="btn pri" data-pr>Imprimer / PDF</button>'}`,

function standaloneDoc(title, inner) {
  const css = [...document.querySelectorAll('style')].map(x => x.textContent).join('\n').split('\n').filter(l => l.trim().startsWith('.doc')).join('\n');
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px;background:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left}.n{text-align:right}@page{margin:14mm}@media print{body{padding:0}}${css}<\/style><\/head><body>${inner}<script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script><\/body><\/html>`;
}

  const low = lowStock(); const val = ps.reduce((a, p) => a + (+p.qte || 0) * (+p.prixAchat || 0), 0);

  </tbody></table></div>` : emptyBox('Aucun article', 'Ajoute tes produits (cafés, thés, accessoires…) : le stock se met à jour tout seul avec tes factures et tes achats, et tu es alerté avant la rupture.', '<button class="btn pri" data-act="editProduit">+ Article</button>')}</div>

ACT.commander = fo => {

  </tbody></table></div>` : emptyBox('Aucun achat enregistré', 'Note tes achats de marchandises : ils alimentent ta marge, ta TVA déductible (si assujetti) et peuvent remplir le stock automatiquement.', '<button class="btn pri" data-act="newAchat">+ Achat</button>')}</div>`;
};
const depAchats = (a, b) => state.achats.filter(x => inRange(x.date, a, b)).reduce((s, x) => s + (+x.ht || 0), 0);

  ${rows.map(({ p, c }) => { const d = state.declarations[p.key]; const late = !d && p.due < today() && p.to < today(); const future = p.from > today();
    return `<tr style="${future ? 'opacity:.45' : ''}"><td><b>${p.label}</b></td><td class="n">${eur(c.collVente)}</td><td class="n">${eur(c.collService)}</td><td class="n">${eur(c.ded)}</td><td class="n"><b>${eur(c.net)}</b></td><td>${fdate(p.due)}${late ? ' ' + badge(['En retard', 'b-bad']) : ''}</td>

  </tbody></table></div><p class="small muted" style="margin:12px 0 0">* Dates indicatives (elles dépendent de ton SIREN). TVA sur ventes exigible à la facturation, sur prestations à l'encaissement. Déductible = TVA des achats et frais saisis. Vérifie toujours avant de déclarer sur impots.gouv.fr.</p></div>`;

/* ----- ce qui me reste ----- */
function poche(from, to) {
  const s = S(); const e = encaissements(from, to); const d = depenses(from, to);
  const achats = r2(state.achats.filter(a => inRange(a.date, from, to)).reduce((x, a) => x + (+a.ht || 0) + achatTva(a), 0));
  const frais = r2(state.frais.filter(f => inRange(f.date, from, to)).reduce((x, f) => x + (+f.ttc || 0), 0));
  const cot = r2(e.vente * s.tauxVente / 100 + e.service * s.tauxService / 100);

bindView.reglages = () => {
  const ts = $('#tplSel'); ts.onchange = () => { tplSel = ts.value; render(); };
  let last = $('#tplBody'); $('#tplSub').onfocus = e => last = e.target; $('#tplBody').onfocus = e => last = e.target;
  $$('[data-ph]').forEach(c => c.onclick = () => { const el = last; const p = el.selectionStart ?? el.value.length; el.value = el.value.slice(0, p) + `{${c.dataset.ph}}` + el.value.slice(el.selectionEnd ?? p); el.focus(); });
};
ACT.saveSettings = () => { const v = formData($('#settingsForm')); Object.assign(state.settings, v); save(); render(); toast('Réglages enregistrés ✔'); };
ACT.tplSave = () => { state.settings.templates[tplSel] = { subject: $('#tplSub').value, body: $('#tplBody').value }; save(); render(); toast('Modèle enregistré ✔'); };
ACT.tplReset = () => { delete state.settings.templates[tplSel]; save(); render(); toast('Modèle d\'origine rétabli'); };
async function download(name, text, type) {
  if (isArt()) {
    const dl = await claude.use('downloads').catch(() => null);
    if (!dl) { toast('Téléchargement indisponible ici'); return; }
    try { await dl.save({ filename: name, data: new Blob([text], { type }) }); } catch (e) { if (e && e.code !== 'declined') toast('Téléchargement annulé'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
ACT.exportJson = () => { download(`maison-bartheau-sauvegarde-${today()}.json`, JSON.stringify(state, null, 2), 'application/json'); toast('Sauvegarde téléchargée'); };
ACT.importJson = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.settings || !Array.isArray(d.factures)) throw 0;
    confirmBox('Remplacer toutes les données actuelles par cette sauvegarde ?', () => { const b = blank(); state = { ...b, ...d, settings: { ...DEFAULT_SETTINGS, ...d.settings } }; save(); render(); toast('Sauvegarde importée ✔'); }, 'Importer'); } catch (e) { toast('Fichier invalide'); } }; r.readAsText(f); };
  i.click(); };
ACT.exportCsv = () => {
  const rows = [['Type', 'Date', 'Numéro / Tiers', 'Description', 'Catégorie', 'HT', 'TVA', 'TTC', 'Encaissé / Réglé']];
  state.factures.filter(f => f.statut !== 'brouillon').forEach(f => { const t = totals(f); rows.push(['Facture', f.date, f.numero, client(f.clientId)?.nom || '', 'Ventes', t.ht, t.tva, t.ttc, paid(f)]); });
  state.factures.forEach(f => (f.paiements || []).forEach(p => rows.push(['Encaissement', p.date, f.numero, p.mode, 'Recette', '', '', p.montant, p.montant])));
  state.achats.forEach(a => rows.push(['Achat', a.date, a.fournisseur, a.desc, a.categorie, a.ht, achatTva(a), r2(+a.ht + achatTva(a)), a.paye ? 'oui' : 'non']));
  state.frais.forEach(f => rows.push(['Frais', f.date, '', f.desc, f.categorie, r2(f.ttc - f.tva), f.tva, f.ttc, 'oui']));
  const csv = '﻿' + rows.map(r => r.map(v => typeof v === 'number' ? String(v).replace('.', ',') : `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
  download(`maison-bartheau-export-${today()}.csv`, csv, 'text/csv'); toast('Export CSV téléchargé (ouvrable dans Excel)');
};
ACT.resetAll = () => confirmBox('⚠️ Effacer <b>toutes</b> les données (clients, factures, stock…) ? Exporte une sauvegarde avant si besoin. Action irréversible.', () => { state = blank(); save(); render(); toast('Données effacées'); }, 'Tout effacer');
